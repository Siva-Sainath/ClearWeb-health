name: Scraper watcher

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  watcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper deps
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run watcher once
        working-directory: scraper
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_UNLOCKER_ZONE: ${{ secrets.BRIGHTDATA_UNLOCKER_ZONE }}
          BRIGHTDATA_USE_UNLOCKER_ALL: "1"
        run: python watcher.py --once || true

      - name: Sweep pending collector jobs
        working-directory: scraper
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: python sweep_collector_jobs.py || true

      - name: Approve orphaned heals
        working-directory: scraper
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: python check_and_approve_heal.py || true
