  <text x="60" y="908" fill="#f8fafc" font-size="13" font-weight="600">Key flows</text>
  <text x="60" y="932" fill="#38bdf8" font-size="11">1 Voice: mic - STT - POST /api/agent/chat - Groq LLM - profile tags - frontend</text>
  <text x="60" y="952" fill="#fbbf24" font-size="11">2 Brain: POST /api/scrape/session - brainService - cached SQLite OR live Bright Data OR demo snapshot</text>
  <text x="60" y="972" fill="#fde68a" font-size="11">   Returns: results, replayEvents, healEvents, executiveSummary, explanation, presentation steps</text>
  <text x="60" y="992" fill="#fb923c" font-size="11">3 Live SSE: POST /api/scrape/start - scrapeService streams events to frontend timeline</text>
  <text x="60" y="1012" fill="#c4b5fd" font-size="11">4 Results: deterministicExplanation + resultsConductor - UI actions + TTS captions</text>
  <text x="60" y="1032" fill="#4ade80" font-size="11">5 Collectors: GET /api/collectors/status - POST /api/collectors/heal - Bright Data self-heal</text>
